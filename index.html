    <style>
      body {
        font-family: 'Pretendard', sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        max-width: 900px;
        padding: 40px 20px;
      }
      /* Perfect Grid Logic */
      .mandalart-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 12px;
        background-color: #333;
        border: 4px solid #111;
        padding: 12px;
        box-shadow: 0 40px 80px rgba(0,0,0,0.2);
        aspect-ratio: 1 / 1;
        width: 100%;
      }
      .mandalart-block {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 2px;
        background-color: #444;
      }
      
      /* 3D Flip Mechanics */
      .flip-card {
        background-color: transparent;
        perspective: 1000px;
        width: 100%;
        height: 100%;
      }
      .flip-card-inner {
        position: relative;
        width: 100%;
        height: 100%;
        text-align: center;
        transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        transform-style: preserve-3d;
      }
      .flip-card.is-flipped .flip-card-inner {
        transform: rotateY(180deg);
      }
      .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4px;
        cursor: pointer;
      }
      .flip-card-front {
        background-color: white;
        color: #111;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.2;
      }
      .flip-card-back {
        background-color: #111;
        color: #fff;
        transform: rotateY(180deg);
        font-size: 9px;
        text-align: left;
        padding: 8px;
        justify-content: flex-start;
      }

      /* Special Cell Styles */
      .cell-category {
        background-color: #d4e11e !important;
        color: #000 !important;
        font-weight: 900 !important;
        font-size: 12px !important;
      }
      .cell-master {
        background-color: #000 !important;
        color: #fff !important;
        font-size: 15px !important;
        font-weight: 900 !important;
        letter-spacing: -0.05em;
      }
      .cell-completed {
        background-color: #f1f3f5 !important;
        color: #adb5bd !important;
        text-decoration: line-through;
      }

      /* Custom Scrollbar for Card Back */
      .flip-card-back::-webkit-scrollbar { width: 2px; }
      .flip-card-back::-webkit-scrollbar-thumb { background: #d4e11e; }

      @media (max-width: 640px) {
        .flip-card-front { font-size: 7px; padding: 2px; }
        .flip-card-back { font-size: 6px; padding: 4px; }
        .mandalart-container { gap: 4px; padding: 4px; }
      }

      @media print {
        .controls { display: none !important; }
        .mandalart-container { box-shadow: none; transform: none !important; }
      }
    </style>
